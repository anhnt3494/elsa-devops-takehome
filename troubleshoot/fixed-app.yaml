# DevOps Assignment — Part 3: FIXED manifests (see TROUBLESHOOTING.md).
# Every change from broken-app.yaml is marked with `# FIX:`.
# Run troubleshoot/prepare.sh first, then apply this file as-is.
# Diagnose and fix until troubleshoot/verify.sh prints PASS.
# Rules:
#   - Do NOT delete the default-deny NetworkPolicy — add least-privilege allow rules instead.
#   - Do NOT remove node taints or labels — fix the workloads, not the nodes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: troubleshoot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: troubleshoot
data:
  index.html: |
    <html><body><h1>TROUBLESHOOT-OK</h1></body></html>
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: troubleshoot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# FIX: least-privilege allow rules on top of default-deny (kept as-is).
# Only the smoke-test client needs name resolution, so DNS egress is scoped
# to it and to the cluster DNS pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smoke-client-dns
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: smoke-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# FIX: client -> web on the container port (policies apply after the
# Service DNAT, so this is 80 on the pod, not the Service port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smoke-client-to-web
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: smoke-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 80
---
# FIX: web accepts HTTP from the client only. Kubelet probes are not
# affected by default-deny (node-local traffic), so no rule is needed for them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-from-smoke-client
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: smoke-client
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: troubleshoot
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          # FIX: 1.25.99 does not exist; 1.25.5 is the last 1.25 patch (1.25 is EOL -> upgrade tracked separately).
          image: nginx:1.25.5
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              # FIX: 16Gi for nginx (measured peak ~17Mi) is unschedulable on normal nodes.
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
          # FIX: probes pointed at 8080; the stock nginx image listens on 80.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            # FIX: ConfigMap is named web-config, not web-conf.
            name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: troubleshoot
spec:
  selector:
    # FIX: pods are labeled app=web, not app=webapp.
    app: web
  ports:
    - protocol: TCP
      port: 80
      # FIX: container port is 80, not 8080.
      targetPort: 80
---
# Simulated AI inference workload. In production this runs on our GPU
# nodepool. It must end up Running on the GPU-labeled node — without
# touching the node's taint or labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: troubleshoot
  labels:
    app: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      # FIX: the node label is acme.io/node-type (prefixed), and the GPU node's
      # nvidia.com/gpu=true:NoSchedule taint must be tolerated.
      nodeSelector:
        acme.io/node-type: gpu
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: inference
          image: busybox:1.36
          command: ["sh", "-c", "echo 'inference engine warm'; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
