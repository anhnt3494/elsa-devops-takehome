image:
  repository: ghcr.io/anhnt3494/quote-api
  tag: 0013637a5d997f638213e201406496ef6b9a704e
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 128Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  maxUnavailable: 1

placement:
  capacityLabel: acme.io/capacity
  allowedCapacities: [spot, on-demand]
  spotWeight: 100
  onDemandWeight: 10
  capacityMaxSkew: 1

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  host: ""
  path: /

terminationGracePeriodSeconds: 30

shutdownGraceSeconds: 5
